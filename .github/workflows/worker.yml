# Shared deploy + preview workflow for every Worker repo (v2); each repo only has the caller
# (caller/cloudflare.yml). It runs as the calling repo, which holds no Cloudflare credential:
#   build     runs the repo's code (install, bundle) with nothing to steal: no secrets, and no
#             id-token permission, so it can't ask for an OIDC token either
#   deploy    main -> production. Runs no repo code: a pinned Wrangler on build's output, with a
#             token from the platform's broker, which checks this run's GitHub OIDC token (this
#             workflow, the repo's manifest, main's head, merged from a reviewed PR)
#   preview   pull requests -> the Worker's Preview pr-<n> (`wrangler preview`), same way;
#             closed -> the Preview is deleted
# KV IDs come from the broker (production's, or the _PREVIEW copies) and are written into every
# upload. A Preview takes its bindings only from the `previews` block, which is written here, and
# inherits nothing from production. Runtime secrets: GitHub secrets named WORKER_<NAME> ship as
# <NAME>; nothing else.
# Every job revokes its token when done; the broker's cron deletes any a crashed job left.
name: worker
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

env:
  # Fixed here, never from the calling repo: anyone who could repoint it could catch the OIDC token.
  BROKER: https://cfp-broker.internal-a20.workers.dev
  WRANGLER: wrangler@4.151.3
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && vars.CFP_PREVIEWS == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      subject: ${{ steps.package.outputs.subject }}
    env:
      ROOT: ${{ vars.CFP_ROOT_DIR || '.' }}
      CLOSED: ${{ github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: env.CLOSED != 'true'
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        if: env.CLOSED != 'true'
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then npx --yes pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then npx --yes yarn install --frozen-lockfile
          elif [ -f package.json ]; then npm install
          fi
      - name: Bundle
        if: env.CLOSED != 'true'
        working-directory: ${{ env.ROOT }}
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/pkg/bundle"
      - name: Package
        id: package
        working-directory: ${{ env.ROOT }}
        run: |
          cfg=""; for f in wrangler.jsonc wrangler.json; do [ -f "$f" ] && { cfg=$f; break; }; done
          [ -n "$cfg" ] || { echo "::error::needs wrangler.jsonc (wrangler.toml isn't supported)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pkg/src"
          cp "$cfg" "$RUNNER_TEMP/pkg/config.jsonc"
          # The source tree minus dependencies, for static assets; deploy reads nothing else from it.
          tar --exclude=node_modules --exclude=.git -cf - . | tar -xf - -C "$RUNNER_TEMP/pkg/src"
          echo "subject=$(git log -1 --format=%s | cut -c1-100)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: worker
          path: ${{ runner.temp }}/pkg
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token for the broker; no repo code runs in this job
    concurrency:
      group: cfp-production
      cancel-in-progress: false
    env:
      KIND: production
      MODE: deploy
      MESSAGE: ${{ needs.build.outputs.subject }}
    steps:
      - &download
        uses: actions/download-artifact@v8
        with:
          name: worker
          path: ${{ runner.temp }}/pkg
      - &node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - &token
        name: Get a token from the broker
        run: |
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BROKER" | jq -r .value)
          echo "::add-mask::$oidc"
          resp=$(curl -sS -X POST "$BROKER/token" -H "Authorization: Bearer $oidc" -H "Content-Type: application/json" \
            -d "{\"kind\":\"$KIND\"}" -w '\n%{http_code}')
          code=${resp##*$'\n'}; body=${resp%$'\n'*}
          if [ "$code" != 200 ]; then
            echo "::error::The broker refused a $KIND token (HTTP $code): $(jq -r '.error // .' <<<"$body" 2>/dev/null || echo "$body")"
            exit 1
          fi
          token=$(jq -r .token <<<"$body"); echo "::add-mask::$token"
          jq -e '.kv and .secrets and .subdomain' <<<"$body" >/dev/null || { echo "::error::broker response lacks kv/secrets/subdomain"; exit 1; }
          jq 'del(.token)' <<<"$body" > "$RUNNER_TEMP/broker.json"
          { echo "CLOUDFLARE_API_TOKEN=$token"; echo "CLOUDFLARE_ACCOUNT_ID=$(jq -r .account_id <<<"$body")"
            echo "WORKER=$(jq -r .worker <<<"$body")"; } >> "$GITHUB_ENV"
          echo "Got a $KIND token for $(jq -r .worker <<<"$body"), expiring $(jq -r .expires_on <<<"$body")"
      - &prepare
        name: Prepare the upload
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/deploy"
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund "$WRANGLER" >/dev/null
          [ "$MODE" != delete ] || exit 0 # deleting a Preview needs no upload
          node - <<'JS'
          // Builds $RUNNER_TEMP/deploy/wrangler.json (plus bundle and assets) from build's output for
          // a pinned Wrangler. Nothing in it can run code here: no build commands, no .env, no symlinks.
          const fs = require("fs"), path = require("path");
          const T = process.env.RUNNER_TEMP, mode = process.env.MODE;
          const pkg = path.join(T, "pkg"), out = path.join(T, "deploy");
          const broker = JSON.parse(fs.readFileSync(path.join(T, "broker.json"), "utf8"));
          const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

          function stripJsonc(text) { // comments and trailing commas, outside strings
            let s = "", inStr = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i], n = text[i + 1];
              if (inStr) { s += c; if (c === "\\") s += text[++i]; else if (c === '"') inStr = false; continue; }
              if (c === '"') { inStr = true; s += c; continue; }
              if (c === "/" && n === "/") { while (i < text.length && text[i] !== "\n") i++; s += "\n"; continue; }
              if (c === "/" && n === "*") { const e = text.indexOf("*/", i + 2); if (e < 0) fail("bad comment in wrangler.jsonc"); i = e + 1; continue; }
              if (c === ",") { let j = i + 1; while (/\s/.test(text[j] || "")) j++; if (text[j] === "}" || text[j] === "]") continue; }
              s += c;
            }
            return s;
          }
          function walk(dir, f, base = dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isSymbolicLink()) fail(`symlinks aren't deployed: ${path.relative(pkg, p)}`);
              if (e.isDirectory()) walk(p, f, base); else f(p, path.relative(base, p));
            }
          }
          const kvId = (binding) => broker.kv[binding] ||
            fail(`KV binding ${binding} isn't in this Worker's manifest (resources.kv in cf-platform)`);

          const cfg = JSON.parse(stripJsonc(fs.readFileSync(path.join(pkg, "config.jsonc"), "utf8")));
          const entry = path.basename(cfg.main || "index.js").replace(/\.[^.]+$/, "") + ".js";
          const previewVars = cfg.previews?.vars;
          // Code-running, bundling and target keys: the platform decides these, not the repo.
          for (const k of ["build", "env", "containers", "name", "account_id", "routes", "route", "main", "dev", "previews",
                           "tsconfig", "alias", "define", "no_bundle", "find_additional_modules", "base_dir"]) delete cfg[k];
          cfg.kv_namespaces = (cfg.kv_namespaces || []).map((k) => ({ binding: k.binding, id: kvId(k.binding) }));

          const bundle = path.join(pkg, "bundle");
          if (!fs.existsSync(path.join(bundle, entry))) fail(`bundle has no ${entry}`);
          walk(bundle, () => {});
          fs.cpSync(bundle, path.join(out, "bundle"), { recursive: true });
          if (cfg.assets?.directory) {
            const src = path.resolve(pkg, "src", cfg.assets.directory);
            if (!src.startsWith(path.join(pkg, "src") + path.sep)) fail("assets.directory must be inside the repo");
            walk(src, () => {});
            fs.cpSync(src, path.join(out, "assets"), { recursive: true });
            cfg.assets.directory = "./assets";
          }
          Object.assign(cfg, { main: `./bundle/${entry}`, no_bundle: true, find_additional_modules: true, base_dir: "./bundle" });

          if (mode === "preview") {
            // A Preview's bindings come only from this block: the same names, with KV IDs from the
            // broker (the _PREVIEW copies), and nothing that would reach production's data.
            const dos = cfg.durable_objects?.bindings || [];
            const unsupported = ["d1_databases", "r2_buckets", "queues", "workflows", "hyperdrive", "vectorize",
              "dispatch_namespaces", "mtls_certificates", "send_email", "pipelines", "secrets_store_secrets", "images",
              "unsafe", "tail_consumers", "wasm_modules", "text_blobs", "data_blobs"]
              .filter((k) => cfg[k] !== undefined && !(Array.isArray(cfg[k]) && !cfg[k].length));
            if (dos.some((d) => d.script_name)) unsupported.push("durable_objects of other Workers");
            if (unsupported.length) fail(`previews don't support ${unsupported.join(", ")} yet`);
            cfg.previews = {
              vars: previewVars ?? cfg.vars ?? {},
              kv_namespaces: cfg.kv_namespaces,
              // Durable Objects of this Worker get a fresh namespace in each Preview.
              ...(dos.length && { durable_objects: { bindings: dos } }),
              ...Object.fromEntries(["services", "analytics_engine_datasets", "ai", "version_metadata", "browser"]
                .filter((k) => cfg[k] !== undefined).map((k) => [k, cfg[k]])),
            };
          }
          fs.writeFileSync(path.join(out, "wrangler.json"), JSON.stringify(cfg, null, 2));
          const shown = mode === "preview" ? cfg.previews : cfg;
          console.log(`${mode} ${cfg.main}; settings: ${Object.keys(shown).sort().join(", ")}`);
          JS
      - &secrets
        name: Collect runtime secrets
        if: github.event.action != 'closed'
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Every WORKER_ secret GitHub has for this run (names from the broker) must be visible here.
          jq '.secrets' "$RUNNER_TEMP/broker.json" > "$RUNNER_TEMP/expected.json"
          missing=$(jq -r --slurpfile want "$RUNNER_TEMP/expected.json" '$want[0] - keys | .[]' <<<"$SECRETS")
          [ -z "$missing" ] || { echo "::error::secrets not visible to the workflow: $missing"; exit 1; }
          jq --slurpfile want "$RUNNER_TEMP/expected.json" \
            'with_entries(select(.key as $k | $want[0] | index($k)) | .key |= ltrimstr("WORKER_"))' \
            <<<"$SECRETS" > "$RUNNER_TEMP/secrets.json"
          echo "Shipping $(jq length "$RUNNER_TEMP/secrets.json") secret(s): $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/secrets.json")"

      - name: Deploy
        working-directory: ${{ runner.temp }}/deploy
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/wrangler" deploy --name "$WORKER" \
            --secrets-file "$RUNNER_TEMP/secrets.json" --message "$MESSAGE" --tag "${GITHUB_SHA::7}"

      # --secrets-file only adds and updates (a deploy inherits secrets from the latest version):
      # anything not a WORKER_ secret of the production environment goes here.
      - name: Remove secrets not in GitHub
        working-directory: ${{ runner.temp }}/deploy
        run: |
          wr="$RUNNER_TEMP/tools/node_modules/.bin/wrangler"
          "$wr" secret list --name "$WORKER" --format json \
            | jq -r --slurpfile keep "$RUNNER_TEMP/secrets.json" '.[].name | select(in($keep[0]) | not)' \
            | while read -r s; do
                echo "Removing $s: no WORKER_$s secret in the production environment"
                "$wr" secret delete "$s" --name "$WORKER"
              done

      - &revoke
        name: Revoke the token
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl -sS -X POST "$BROKER/revoke" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; echo
      - &cleanup
        name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/broker.json" "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/deploy"

  preview:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      id-token: write # the OIDC token for the broker; no repo code runs in this job
    concurrency:
      group: cfp-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      KIND: preview
      MODE: ${{ github.event.action == 'closed' && 'delete' || 'preview' }}
      PREVIEW: pr-${{ github.event.pull_request.number }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - *download
      - *node
      - *token
      - *prepare
      - *secrets
      # The Worker's Preview pr-<n>: listed under the Worker in the dashboard, with its own URL.
      # --ignore-base-config: only this config and the preview environment's secrets apply, never
      # settings edited in the dashboard.
      - name: Deploy the Preview
        id: preview
        if: env.MODE == 'preview'
        working-directory: ${{ runner.temp }}/deploy
        run: |
          message="PR #$PR: $TITLE"
          # GITHUB_SHA is GitHub's test merge on pull requests; the Preview runs the PR's head.
          GITHUB_SHA="$SHA" WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/out.json" "$RUNNER_TEMP/tools/node_modules/.bin/wrangler" preview \
            --name "$PREVIEW" --worker-name "$WORKER" --ignore-base-config \
            --secrets-file "$RUNNER_TEMP/secrets.json" --message "${message:0:100}" --tag "${SHA::7}"
          url=$(jq -rs 'map(select(.type == "preview")) | last | .preview_urls[0] // empty' "$RUNNER_TEMP/out.json")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview $PREVIEW: ${url:-no URL}" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the Preview
        if: env.MODE == 'delete'
        working-directory: ${{ runner.temp }}/deploy
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/wrangler" preview delete \
            --name "$PREVIEW" --worker-name "$WORKER" --skip-confirmation && exit 0
          # A PR opened before previews were on has none (10025); anything else is a real failure.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER/previews/$PREVIEW")
          [ "$code" = 404 ] || exit 1
          echo "No Preview $PREVIEW to delete"
      - *revoke
      - *cleanup
