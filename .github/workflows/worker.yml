# Shared deploy + preview workflow for every Worker repo; each repo only has the caller
# (caller/cloudflare.yml). It runs as the calling repo: its variables, its environments, its
# GITHUB_TOKEN. This repo holds no secrets. cf-platform (reconcile.py) sets up what it reads:
#   variables   CFP_WORKER, CLOUDFLARE_ACCOUNT_ID, CFP_ROOT_DIR, CFP_PREVIEW_WORKER (previews only)
#   production  environment, main only: CFP_DEPLOY_TOKEN (this Worker only) + runtime secrets
#   preview     environment, any branch: CFP_PREVIEW_TOKEN (the preview Worker only) + its secrets
# The tokens' scope is the boundary, not this file: a PR can edit its own caller, but only runs
# on main get the production environment.
name: worker
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

jobs:
  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    concurrency:
      group: cfp-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFP_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ vars.CFP_WORKER }}
      ROOT: ${{ vars.CFP_ROOT_DIR || '.' }}
    steps:
      - name: Check setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$WORKER" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Not set up for deploys: this repo needs a merged manifest in cf-platform"
            exit 1
          fi

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then npx --yes pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then npx --yes yarn install --frozen-lockfile
          elif [ -f package.json ]; then npm install
          fi

      # Every production environment secret except ours is a Worker secret, under the same name.
      - name: Collect runtime secrets
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Our own token proves the environment's secrets are visible; never ship (or prune) blind.
          jq -e 'has("CFP_DEPLOY_TOKEN")' <<<"$SECRETS" >/dev/null || { echo "::error::production secrets not visible"; exit 1; }
          jq 'with_entries(select((.key | startswith("CFP_") | not) and .key != "github_token"))' <<<"$SECRETS" \
            > "$RUNNER_TEMP/secrets.json"
          echo "Shipping $(jq length "$RUNNER_TEMP/secrets.json") secret(s): $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/secrets.json")"

      - name: Deploy
        working-directory: ${{ env.ROOT }}
        run: |
          npx --yes wrangler deploy --name "$WORKER" --secrets-file "$RUNNER_TEMP/secrets.json" \
            --message "$(git log -1 --format=%s | cut -c1-100)" --tag "${GITHUB_SHA::7}"

      # --secrets-file only adds and updates; a secret removed from the environment goes here.
      - name: Remove secrets deleted from GitHub
        working-directory: ${{ env.ROOT }}
        run: |
          npx --yes wrangler secret list --name "$WORKER" --format json \
            | jq -r --slurpfile keep "$RUNNER_TEMP/secrets.json" '.[].name | select(in($keep[0]) | not)' \
            | while read -r s; do
                echo "Removing $s: no longer in the production environment"
                npx --yes wrangler secret delete "$s" --name "$WORKER"
              done

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"

  preview:
    # Branches of this repo only: PRs from forks get no secrets.
    if: >-
      github.event_name == 'pull_request' && vars.CFP_PREVIEW_WORKER != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.upload.outputs.url }}
    permissions:
      contents: read
    concurrency:
      group: cfp-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFP_PREVIEW_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: ${{ vars.CFP_PREVIEW_WORKER }}
      ROOT: ${{ vars.CFP_ROOT_DIR || '.' }}
      ALIAS: pr-${{ github.event.pull_request.number }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Not set up for previews: set previews: true in this Worker's cf-platform manifest"
            exit 1
          fi

      - uses: actions/checkout@v5
        if: github.event.action != 'closed'
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        if: github.event.action != 'closed'
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then npx --yes pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then npx --yes yarn install --frozen-lockfile
          elif [ -f package.json ]; then npm install
          fi

      - name: Collect preview secrets
        if: github.event.action != 'closed'
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          jq 'with_entries(select((.key | startswith("CFP_") | not) and .key != "github_token"))' <<<"$SECRETS" \
            > "$RUNNER_TEMP/secrets.json"
          echo "Shipping $(jq length "$RUNNER_TEMP/secrets.json") secret(s): $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/secrets.json")"

      - name: Upload preview version
        id: upload
        if: github.event.action != 'closed'
        working-directory: ${{ env.ROOT }}
        run: |
          out="$RUNNER_TEMP/wrangler.ndjson"
          WRANGLER_OUTPUT_FILE_PATH="$out" npx --yes wrangler versions upload \
            --name "$WORKER" --preview-alias "$ALIAS" --secrets-file "$RUNNER_TEMP/secrets.json" \
            --message "$(printf 'PR #%s: %s' "$PR" "$TITLE" | cut -c1-100)" --tag "${SHA::7}"
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$out" | tail -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      # Aliases can't be deleted (Cloudflare keeps the newest 1000): point a closed PR's at a notice.
      - name: Retire the preview (PR closed)
        if: github.event.action == 'closed'
        run: |
          d="$RUNNER_TEMP/closed" && mkdir -p "$d" && cd "$d"
          printf 'export default { fetch: () => new Response("The preview for PR #%s is closed.", { status: 410 }) };\n' "$PR" > index.js
          npx --yes wrangler versions upload index.js --name "$WORKER" --preview-alias "$ALIAS" \
            --compatibility-date 2026-10-01 --message "PR #$PR closed"

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.json"
