# Shared deploy + preview workflow for every Worker repo; each repo only has the caller
# (caller/cloudflare.yml, `@main`). It runs as the calling repo, which holds no Cloudflare credential:
#   build     runs the repo's code (install, bundle) with nothing to steal: no secrets, and no
#             id-token permission, so it can't ask for an OIDC token either
#   deploy    main -> production. Runs no repo code: a pinned Wrangler on build's output, with a
#             token from the platform's broker, which checks this run's GitHub OIDC token (this
#             workflow, the repo's manifest, main's head, merged from a reviewed PR)
#   preview   pull requests -> the Worker's Preview pr-<n> (`wrangler preview`), same way;
#             preview-delete: closed -> the Preview is deleted, its PR deployments marked inactive
#   report    the only job that comments on the PR: the Preview's links, whether production was
#             deployed, or which step failed and what to do. It holds no token and runs no repo code.
# A failure is reported where it happened; nothing retries it later. Only the broker call
# retries itself, on transient errors.
# KV IDs come from the broker (production's, or the _PREVIEW copies) and are written into every
# upload. A Preview takes its bindings only from the `previews` block, which is written here, and
# inherits nothing from production. Runtime secrets: GitHub secrets named WORKER_<NAME> ship as
# <NAME>; nothing else.
# Every job revokes its token when done; the broker's cron deletes any a crashed job left.
name: worker
on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

env:
  # Fixed here, never from the calling repo: anyone who could repoint it could catch the OIDC token.
  BROKER: https://cfp-broker.internal-a20.workers.dev
  WRANGLER: wrangler@4.151.3
  WRANGLER_SEND_METRICS: "false"

jobs:
  build:
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && vars.CFP_PREVIEWS == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      subject: ${{ steps.package.outputs.subject }}
      failed: ${{ steps.failed.outputs.step }}
    env:
      ROOT: ${{ vars.CFP_ROOT_DIR || '.' }}
      CLOSED: ${{ github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        if: env.CLOSED != 'true'
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        id: install
        if: env.CLOSED != 'true'
        working-directory: ${{ env.ROOT }}
        run: |
          if [ -f package-lock.json ]; then npm ci
          elif [ -f pnpm-lock.yaml ]; then npx --yes pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then npx --yes yarn install --frozen-lockfile
          elif [ -f package.json ]; then npm install
          fi
      - name: Bundle
        id: bundle
        if: env.CLOSED != 'true'
        working-directory: ${{ env.ROOT }}
        run: npx --yes "$WRANGLER" deploy --dry-run --outdir "$RUNNER_TEMP/pkg/bundle"
      - name: Package
        id: package
        working-directory: ${{ env.ROOT }}
        run: |
          cfg=""; for f in wrangler.jsonc wrangler.json; do [ -f "$f" ] && { cfg=$f; break; }; done
          [ -n "$cfg" ] || { echo "::error::needs wrangler.jsonc (wrangler.toml isn't supported)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pkg/src"
          cp "$cfg" "$RUNNER_TEMP/pkg/config.jsonc"
          # The source tree minus dependencies, for static assets; deploy reads nothing else from it.
          tar --exclude=node_modules --exclude=.git -cf - . | tar -xf - -C "$RUNNER_TEMP/pkg/src"
          echo "subject=$(git log -1 --format=%s | cut -c1-100)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: worker
          path: ${{ runner.temp }}/pkg
          include-hidden-files: true
          retention-days: 1
      - &failed
        # The first step (with an id) that failed, for the report job.
        id: failed
        if: failure()
        env:
          STEPS: ${{ toJSON(steps) }}
        run: echo "step=$(jq -r 'to_entries | map(select(.value.outcome == "failure")) | first | .key // "unknown"' <<<"$STEPS")" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write # the OIDC token for the broker; no repo code runs in this job
    outputs:
      version: ${{ steps.deploy.outputs.version }}
      worker: ${{ steps.token.outputs.worker }}
      refused: ${{ steps.token.outputs.refused }}
      failed: ${{ steps.failed.outputs.step }}
    concurrency:
      group: cfp-production
      cancel-in-progress: false
    env:
      KIND: production
      MODE: deploy
      MESSAGE: ${{ needs.build.outputs.subject }}
    steps:
      - &download
        id: download
        uses: actions/download-artifact@v8
        with:
          name: worker
          path: ${{ runner.temp }}/pkg
      - &node
        id: node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
      - &token
        name: Get a token from the broker
        id: token
        run: |
          # Transient errors (timeouts, 5xx, refused connections) are retried twice, seconds apart;
          # a refusal (4xx) never is.
          retry=(--retry 2 --retry-delay 5 --retry-connrefused)
          oidc=$(curl -sSf "${retry[@]}" -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BROKER" | jq -r .value)
          echo "::add-mask::$oidc"
          resp=$(curl -sS "${retry[@]}" -X POST "$BROKER/token" -H "Authorization: Bearer $oidc" \
            -H "Content-Type: application/json" -d "{\"kind\":\"$KIND\"}" -w '\n%{http_code}') || resp=$'\n000'
          code=${resp##*$'\n'}; body=${resp%$'\n'*}
          if [ "$code" != 200 ]; then
            reason="The broker refused a $KIND token (HTTP $code): $(jq -r '.error // .' <<<"$body" 2>/dev/null || echo "$body")"
            [ "$code" = 000 ] && reason="The broker didn't answer"
            echo "::error::$reason"
            echo "refused=$(tr -d '\r\n' <<<"$reason")" >> "$GITHUB_OUTPUT" # for the report job
            exit 1
          fi
          token=$(jq -r .token <<<"$body"); echo "::add-mask::$token"
          jq -e '.kv and .secrets and .subdomain' <<<"$body" >/dev/null || { echo "::error::broker response lacks kv/secrets/subdomain"; exit 1; }
          jq 'del(.token)' <<<"$body" > "$RUNNER_TEMP/broker.json"
          { echo "CLOUDFLARE_API_TOKEN=$token"; echo "CLOUDFLARE_ACCOUNT_ID=$(jq -r .account_id <<<"$body")"
            echo "WORKER=$(jq -r .worker <<<"$body")"; } >> "$GITHUB_ENV"
          echo "worker=$(jq -r .worker <<<"$body")" >> "$GITHUB_OUTPUT"
          echo "Got a $KIND token for $(jq -r .worker <<<"$body"), expiring $(jq -r .expires_on <<<"$body")"
      - &prepare
        name: Prepare the upload
        id: prepare
        env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/tools" "$RUNNER_TEMP/deploy"
          npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund "$WRANGLER" >/dev/null
          [ "$MODE" != delete ] || exit 0 # deleting a Preview needs no upload
          node - <<'JS'
          // Builds $RUNNER_TEMP/deploy/wrangler.json (plus bundle and assets) from build's output for
          // a pinned Wrangler. Nothing in it can run code here: no build commands, no .env, no symlinks.
          const fs = require("fs"), path = require("path");
          const T = process.env.RUNNER_TEMP, mode = process.env.MODE;
          const pkg = path.join(T, "pkg"), out = path.join(T, "deploy");
          const broker = JSON.parse(fs.readFileSync(path.join(T, "broker.json"), "utf8"));
          const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

          function stripJsonc(text) { // comments and trailing commas, outside strings
            let s = "", inStr = false;
            for (let i = 0; i < text.length; i++) {
              const c = text[i], n = text[i + 1];
              if (inStr) { s += c; if (c === "\\") s += text[++i]; else if (c === '"') inStr = false; continue; }
              if (c === '"') { inStr = true; s += c; continue; }
              if (c === "/" && n === "/") { while (i < text.length && text[i] !== "\n") i++; s += "\n"; continue; }
              if (c === "/" && n === "*") { const e = text.indexOf("*/", i + 2); if (e < 0) fail("bad comment in wrangler.jsonc"); i = e + 1; continue; }
              if (c === ",") { let j = i + 1; while (/\s/.test(text[j] || "")) j++; if (text[j] === "}" || text[j] === "]") continue; }
              s += c;
            }
            return s;
          }
          function walk(dir, f, base = dir) {
            for (const e of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, e.name);
              if (e.isSymbolicLink()) fail(`symlinks aren't deployed: ${path.relative(pkg, p)}`);
              if (e.isDirectory()) walk(p, f, base); else f(p, path.relative(base, p));
            }
          }
          const kvId = (binding) => broker.kv[binding] ||
            fail(`KV binding ${binding} isn't in this Worker's manifest (resources.kv in cf-platform)`);

          const cfg = JSON.parse(stripJsonc(fs.readFileSync(path.join(pkg, "config.jsonc"), "utf8")));
          const entry = path.basename(cfg.main || "index.js").replace(/\.[^.]+$/, "") + ".js";
          const previewVars = cfg.previews?.vars;
          // Code-running, bundling and target keys: the platform decides these, not the repo.
          for (const k of ["build", "env", "containers", "name", "account_id", "routes", "route", "main", "dev", "previews",
                           "tsconfig", "alias", "define", "no_bundle", "find_additional_modules", "base_dir"]) delete cfg[k];
          cfg.kv_namespaces = (cfg.kv_namespaces || []).map((k) => ({ binding: k.binding, id: kvId(k.binding) }));

          const bundle = path.join(pkg, "bundle");
          if (!fs.existsSync(path.join(bundle, entry))) fail(`bundle has no ${entry}`);
          walk(bundle, () => {});
          fs.cpSync(bundle, path.join(out, "bundle"), { recursive: true });
          if (cfg.assets?.directory) {
            const src = path.resolve(pkg, "src", cfg.assets.directory);
            if (!src.startsWith(path.join(pkg, "src") + path.sep)) fail("assets.directory must be inside the repo");
            walk(src, () => {});
            fs.cpSync(src, path.join(out, "assets"), { recursive: true });
            cfg.assets.directory = "./assets";
          }
          Object.assign(cfg, { main: `./bundle/${entry}`, no_bundle: true, find_additional_modules: true, base_dir: "./bundle" });

          if (mode === "preview") {
            // A Preview's bindings come only from this block: the same names, with KV IDs from the
            // broker (the _PREVIEW copies), and nothing that would reach production's data.
            const dos = cfg.durable_objects?.bindings || [];
            const unsupported = ["d1_databases", "r2_buckets", "queues", "workflows", "hyperdrive", "vectorize",
              "dispatch_namespaces", "mtls_certificates", "send_email", "pipelines", "secrets_store_secrets", "images",
              "unsafe", "tail_consumers", "wasm_modules", "text_blobs", "data_blobs"]
              .filter((k) => cfg[k] !== undefined && !(Array.isArray(cfg[k]) && !cfg[k].length));
            if (dos.some((d) => d.script_name)) unsupported.push("durable_objects of other Workers");
            if (unsupported.length) fail(`previews don't support ${unsupported.join(", ")} yet`);
            cfg.previews = {
              vars: previewVars ?? cfg.vars ?? {},
              kv_namespaces: cfg.kv_namespaces,
              // Durable Objects of this Worker get a fresh namespace in each Preview.
              ...(dos.length && { durable_objects: { bindings: dos } }),
              ...Object.fromEntries(["services", "analytics_engine_datasets", "ai", "version_metadata", "browser"]
                .filter((k) => cfg[k] !== undefined).map((k) => [k, cfg[k]])),
            };
          }
          fs.writeFileSync(path.join(out, "wrangler.json"), JSON.stringify(cfg, null, 2));
          const shown = mode === "preview" ? cfg.previews : cfg;
          console.log(`${mode} ${cfg.main}; settings: ${Object.keys(shown).sort().join(", ")}`);
          JS
      - &secrets
        name: Collect runtime secrets
        id: secrets
        if: github.event.action != 'closed'
        env:
          SECRETS: ${{ toJSON(secrets) }}
        run: |
          # Every WORKER_ secret GitHub has for this run (names from the broker) must be visible here.
          jq '.secrets' "$RUNNER_TEMP/broker.json" > "$RUNNER_TEMP/expected.json"
          missing=$(jq -r --slurpfile want "$RUNNER_TEMP/expected.json" '$want[0] - keys | .[]' <<<"$SECRETS")
          [ -z "$missing" ] || { echo "::error::secrets not visible to the workflow: $missing"; exit 1; }
          jq --slurpfile want "$RUNNER_TEMP/expected.json" \
            'with_entries(select(.key as $k | $want[0] | index($k)) | .key |= ltrimstr("WORKER_"))' \
            <<<"$SECRETS" > "$RUNNER_TEMP/secrets.json"
          echo "Shipping $(jq length "$RUNNER_TEMP/secrets.json") secret(s): $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/secrets.json")"

      # --secrets-file only adds and updates, and a deploy inherits secrets from the latest version.
      # Secrets without a WORKER_ secret in the production environment are dropped from that
      # version first, as one labelled version that is never deployed itself; the deploy then
      # inherits only what GitHub has, in a single deployment.
      - name: Remove secrets not in GitHub
        id: prune
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER/versions/latest"
          latest=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          if ! jq -e .success <<<"$latest" >/dev/null; then
            jq -e '.errors | any(.code == 10222)' <<<"$latest" >/dev/null && { echo "No versions yet"; exit 0; }
            echo "::error::reading the latest version failed: $(jq -c .errors <<<"$latest")"; exit 1
          fi
          stale=$(jq -c --slurpfile keep "$RUNNER_TEMP/secrets.json" '[.result.env // {} | to_entries[]
            | select(.value.type == "secret_text" and (.key | in($keep[0]) | not)) | .key]' <<<"$latest")
          [ "$stale" != "[]" ] || exit 0
          names=$(jq -r 'join(", ")' <<<"$stale")
          echo "Removing $names: no WORKER_ secret in the production environment"
          body=$(jq -n --argjson s "$stale" --arg m "Remove secrets not in GitHub: $names" --arg t "${GITHUB_SHA::7}" \
            '{env: ($s | map({(.): null}) | add), annotations: {"workers/message": $m[:100], "workers/tag": $t}}')
          res=$(curl -sS -X PATCH -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/merge-patch+json" -d "$body" "$api")
          jq -e .success <<<"$res" >/dev/null || { echo "::error::removing secrets failed: $(jq -c .errors <<<"$res")"; exit 1; }

      - name: Deploy
        id: deploy
        working-directory: ${{ runner.temp }}/deploy
        run: |
          message="$MESSAGE"
          [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] || message="Redeploy: $message"
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || message="$message (attempt $GITHUB_RUN_ATTEMPT)"
          WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/out.json" "$RUNNER_TEMP/tools/node_modules/.bin/wrangler" deploy --name "$WORKER" \
            --secrets-file "$RUNNER_TEMP/secrets.json" --message "${message:0:100}" --tag "${GITHUB_SHA::7}"
          echo "version=$(jq -rs 'map(select(.type == "deploy")) | last | .version_id // empty' "$RUNNER_TEMP/out.json")" >> "$GITHUB_OUTPUT"

      - *failed
      - &revoke
        name: Revoke the token
        if: always() && env.CLOUDFLARE_API_TOKEN != ''
        run: |
          curl -sS -X POST "$BROKER/revoke" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"; echo
      - &cleanup
        name: Clean up
        if: always()
        run: rm -rf "$RUNNER_TEMP/secrets.json" "$RUNNER_TEMP/expected.json" "$RUNNER_TEMP/broker.json" "$RUNNER_TEMP/out.json" "$RUNNER_TEMP/pkg" "$RUNNER_TEMP/deploy"

  preview:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.preview.outputs.url }}
    permissions:
      contents: read
      id-token: write # the OIDC token for the broker; no repo code runs in this job
    outputs:
      url: ${{ steps.preview.outputs.url }}
      commit_url: ${{ steps.preview.outputs.commit_url }}
      worker: ${{ steps.token.outputs.worker }}
      refused: ${{ steps.token.outputs.refused }}
      failed: ${{ steps.failed.outputs.step }}
    concurrency:
      group: cfp-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      KIND: preview
      MODE: preview
      PREVIEW: pr-${{ github.event.pull_request.number }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - *download
      - *node
      - *token
      - *prepare
      - *secrets
      # The Worker's Preview pr-<n>: listed under the Worker in the dashboard, with its own URL.
      # --ignore-base-config: only this config and the preview environment's secrets apply, never
      # settings edited in the dashboard.
      - name: Deploy the Preview
        id: preview
        working-directory: ${{ runner.temp }}/deploy
        run: |
          message="PR #$PR: $TITLE"
          # GITHUB_SHA is GitHub's test merge on pull requests; the Preview runs the PR's head.
          GITHUB_SHA="$SHA" WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/out.json" "$RUNNER_TEMP/tools/node_modules/.bin/wrangler" preview \
            --name "$PREVIEW" --worker-name "$WORKER" --ignore-base-config \
            --secrets-file "$RUNNER_TEMP/secrets.json" --message "${message:0:100}" --tag "${SHA::7}"
          url=$(jq -rs 'map(select(.type == "preview")) | last | .preview_urls[0] // empty' "$RUNNER_TEMP/out.json")
          commit_url=$(jq -rs 'map(select(.type == "preview")) | last | .deployment_urls[0] // empty' "$RUNNER_TEMP/out.json")
          { echo "url=$url"; echo "commit_url=$commit_url"; } >> "$GITHUB_OUTPUT"
          echo "### Preview $PREVIEW: ${url:-no URL}" >> "$GITHUB_STEP_SUMMARY"
      - *failed
      - *revoke
      - *cleanup

  # PR closed (merged or not). No environment: deleting the Preview isn't a deployment, and in the
  # `preview` environment GitHub would show it on the PR as "This branch was successfully deployed".
  preview-delete:
    needs: build
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # the OIDC token for the broker; no repo code runs in this job
      deployments: write # marking the PR's preview deployments inactive
    outputs:
      refused: ${{ steps.token.outputs.refused }}
      failed: ${{ steps.failed.outputs.step }}
    concurrency:
      group: cfp-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      KIND: preview
      MODE: delete
      PREVIEW: pr-${{ github.event.pull_request.number }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - *node
      - *token
      - *prepare
      - name: Delete the Preview
        id: delete
        working-directory: ${{ runner.temp }}/deploy
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/wrangler" preview delete \
            --name "$PREVIEW" --worker-name "$WORKER" --skip-confirmation && exit 0
          # A PR opened before previews were on has none (10025); anything else is a real failure.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/workers/$WORKER/previews/$PREVIEW")
          [ "$code" = 404 ] || exit 1
          echo "No Preview $PREVIEW to delete"
      - name: Mark the PR's preview deployments inactive
        id: inactive
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/deployments?environment=preview&ref=$BRANCH&per_page=100" --jq '.[].id' |
            while read -r id; do
              gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
                -f state=inactive -f description="Preview deleted: PR closed" >/dev/null
            done
      - *failed
      - *revoke
      - *cleanup

  # Tells the PR what happened, success or failure, with the reason and what to do. The PR page only
  # shows deployments of the PR's branch (previews); production's result would be invisible there.
  report:
    needs: [build, deploy, preview, preview-delete]
    if: always() && needs.build.result != 'skipped' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # the PR comments; no token, no repo code in this job
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ACTION: ${{ github.event.action }}
      PREVIEW: pr-${{ github.event.pull_request.number }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      BUILD: ${{ needs.build.result }}
      BUILD_FAILED: ${{ needs.build.outputs.failed }}
      DEPLOY: ${{ needs.deploy.result }}
      DEPLOY_FAILED: ${{ needs.deploy.outputs.failed }}
      DEPLOY_REFUSED: ${{ needs.deploy.outputs.refused }}
      VERSION: ${{ needs.deploy.outputs.version }}
      PREVIEW_RESULT: ${{ needs.preview.result }}
      PREVIEW_FAILED: ${{ needs.preview.outputs.failed }}
      PREVIEW_REFUSED: ${{ needs.preview.outputs.refused }}
      URL: ${{ needs.preview.outputs.url }}
      COMMIT_URL: ${{ needs.preview.outputs.commit_url }}
      DELETE: ${{ needs.preview-delete.result }}
      DELETE_FAILED: ${{ needs.preview-delete.outputs.failed }}
      DELETE_REFUSED: ${{ needs.preview-delete.outputs.refused }}
      WORKER: ${{ needs.deploy.outputs.worker || needs.preview.outputs.worker }}
    steps:
      - name: Comment on the PR
        run: |
          where() { # which step failed, in words
            case "$1" in
              install) echo "the build, installing dependencies" ;;
              bundle) echo "the build, bundling (\`wrangler deploy --dry-run\`)" ;;
              package) echo "the build, packaging (is there a \`wrangler.jsonc\`?)" ;;
              download|node) echo "setting up the job" ;;
              token) echo "getting a token from the broker" ;;
              prepare) echo "preparing the upload from \`wrangler.jsonc\`" ;;
              secrets) echo "collecting the \`WORKER_\` secrets" ;;
              prune) echo "removing secrets that aren't in GitHub" ;;
              deploy) echo "the deploy (\`wrangler deploy\`)" ;;
              preview) echo "the Preview deploy (\`wrangler preview\`)" ;;
              delete) echo "deleting the Preview" ;;
              inactive) echo "marking the preview deployments inactive" ;;
              *) echo "an unnamed step" ;;
            esac
          }
          # A failed build stops everything after it, so it comes first.
          failure() { # job result, its failed step, the broker's refusal
            if [ "$BUILD" = failure ]; then echo "Failed at $(where "$BUILD_FAILED")."
            elif [ "$1" = cancelled ]; then echo "The run was cancelled."
            elif [ -n "$3" ]; then echo "$3."
            else echo "Failed at $(where "$2")."; fi
          }
          upsert() { # the PR's one preview comment, found by its marker
            body="<!-- cfp-preview -->"$'\n'"$1"
            id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments?per_page=100" --jq '[.[] | select(.user.login == "github-actions[bot]"
              and (.body | startswith("<!-- cfp-preview -->")))][0].id // empty')
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" >/dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null
            fi
          }

          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at and .merge_commit_sha == env.GITHUB_SHA)][0].number // empty')
            [ -n "$pr" ] || { echo "No merged PR for ${GITHUB_SHA::7}"; exit 0; }
            if [ "$DEPLOY" = success ]; then
              body="**Deployed to production**: \`$WORKER\` version \`${VERSION:-?}\` (\`${GITHUB_SHA::7}\`). [Run]($RUN)"
            elif [ -n "$DEPLOY_REFUSED" ] && [ "$BUILD" != failure ]; then
              body="**Not deployed to production.** $DEPLOY_REFUSED. Production still runs the previous version. Fix the cause, then merge a PR (an empty commit is fine). [Run]($RUN)"
            else
              body="**Not deployed to production.** $(failure "$DEPLOY" "$DEPLOY_FAILED" "") Production still runs the previous version. Once the cause is fixed, *Re-run failed jobs* on the [run]($RUN) (works while \`main\` hasn't moved), or merge a fix."
            fi
            gh pr comment "$pr" --repo "$GITHUB_REPOSITORY" --body "$body"
          elif [ "$ACTION" = closed ]; then
            if [ "$DELETE" = success ]; then upsert "**Preview** \`$PREVIEW\` deleted: the PR was closed."
            else upsert "**Preview** \`$PREVIEW\` could not be deleted. $(failure "$DELETE" "$DELETE_FAILED" "$DELETE_REFUSED") *Re-run failed jobs* on the [run]($RUN)."; fi
          else
            if [ "$PREVIEW_RESULT" = success ]; then
              upsert "$(printf '**Preview** `%s` of `%s`, built from `%s`\n\n| | |\n|---|---|\n| Latest push | %s |\n| This commit | %s |\n' \
                "$PREVIEW" "$WORKER" "${SHA::7}" "${URL:-none}" "${COMMIT_URL:-none}")"
            else
              upsert "**Preview** \`$PREVIEW\` not updated for \`${SHA::7}\`. $(failure "$PREVIEW_RESULT" "$PREVIEW_FAILED" "$PREVIEW_REFUSED") It still runs an earlier push, if any. Push a fix, or *Re-run failed jobs* on the [run]($RUN)."
            fi
          fi
