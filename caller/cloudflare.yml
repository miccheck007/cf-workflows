# Deploys this repo's Worker: main -> production, pull requests -> previews.
# Copy as is to .github/workflows/cloudflare.yml; everything else lives in miccheck007/cf-workflows
# and the Worker's manifest in miccheck007/cf-platform. This repo holds no Cloudflare credential.
name: cloudflare
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch: # redeploy main, e.g. to ship a changed secret

# The shared workflow's jobs ask for less: the job that runs this repo's code only gets contents: read.
permissions:
  contents: read
  id-token: write # deploy jobs only: to ask the platform's broker for a token
  pull-requests: write # the production job's comment on the merged PR
  deployments: write # marking a closed PR's preview deployments inactive

jobs:
  worker:
    uses: miccheck007/cf-workflows/.github/workflows/worker.yml@main
    # Without it, environment secrets arrive empty in the shared workflow (GitHub behaviour).
    # Only secrets named WORKER_* reach the Worker; the rest is never shipped.
    secrets: inherit
